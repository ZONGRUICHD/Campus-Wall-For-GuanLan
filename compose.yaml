name: ${COMPOSE_PROJECT_NAME:-campus-wall}

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_wall}
      POSTGRES_USER: ${POSTGRES_USER:-campus_wall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:-campus-wall-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5412"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-campus_wall}
      PGUSER: ${POSTGRES_USER:-campus_wall}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGSSL: "false"
      ALLOWED_ORIGINS: ${APP_ORIGIN:?set APP_ORIGIN in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-604800}
      UPLOAD_FOLDER: static/uploads
      CHUNK_FOLDER: static/chunks
      AVATAR_FOLDER: static/avatars
      TINY_FOLDER: static/tiny_files
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-1048576}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-524288000}
      MAX_CHUNK_SIZE: ${MAX_CHUNK_SIZE:-10485760}
      MAX_CHUNK_COUNT: ${MAX_CHUNK_COUNT:-100}
      UPLOAD_BINDING_TTL_MS: ${UPLOAD_BINDING_TTL_MS:-1800000}
      CHUNK_UPLOAD_TTL_MS: ${CHUNK_UPLOAD_TTL_MS:-86400000}
      UPLOAD_CLEANUP_INTERVAL_MS: ${UPLOAD_CLEANUP_INTERVAL_MS:-300000}
      FFMPEG_TIMEOUT_MS: ${FFMPEG_TIMEOUT_MS:-120000}
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-10000}
      MAX_TITLE_LENGTH: ${MAX_TITLE_LENGTH:-200}
      MAX_EMAIL_LENGTH: ${MAX_EMAIL_LENGTH:-320}
      MAX_TAGS: ${MAX_TAGS:-10}
      MAX_TAG_LENGTH: ${MAX_TAG_LENGTH:-50}
      MAX_MESSAGE_FILES: ${MAX_MESSAGE_FILES:-20}
      MAX_COMMENT_FILES: ${MAX_COMMENT_FILES:-10}
      MAX_POLL_OPTIONS: ${MAX_POLL_OPTIONS:-6}
      MAX_POLL_QUESTION_LENGTH: ${MAX_POLL_QUESTION_LENGTH:-200}
      MAX_POLL_OPTION_LENGTH: ${MAX_POLL_OPTION_LENGTH:-80}
      MAX_POLL_DURATION_DAYS: ${MAX_POLL_DURATION_DAYS:-30}
      MAX_AVATAR_SIZE: ${MAX_AVATAR_SIZE:-5242880}
      MAX_APP_ICON_SIZE: ${MAX_APP_ICON_SIZE:-5242880}
      MAX_USER_IMPORT_SIZE: ${MAX_USER_IMPORT_SIZE:-10485760}
      MAX_USER_IMPORT_ROWS: ${MAX_USER_IMPORT_ROWS:-5000}
      MESSAGE_PAGE_SIZE: ${MESSAGE_PAGE_SIZE:-15}
      MAX_PUBLIC_QUERY_SIZE: ${MAX_PUBLIC_QUERY_SIZE:-10000}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-30}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE:-40}
      RATE_LIMIT_INTERACTION: ${RATE_LIMIT_INTERACTION:-240}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-600}
      RATE_LIMIT_FEEDBACK: ${RATE_LIMIT_FEEDBACK:-20}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-none}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_TIMEOUT_MS: ${CAPTCHA_TIMEOUT_MS:-8000}
    volumes:
      - media_data:/var/lib/campus-wall
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5412/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:-campus-wall-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_STATIC_URL: ${VITE_STATIC_URL:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-dd522469-2b45-4814-812e-202678ccee7a}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
  media_data:
