      properties:
        date: { type: string, format: date }
        label: { type: string, pattern: '^[0-9]{1,2}/[0-9]{1,2}$' }
        count: { type: integer, minimum: 0 }

    TopTag:
      type: object
      additionalProperties: false
      required: [tag, count]
      properties:
        tag: { $ref: '#/components/schemas/Tag' }
        count: { type: integer, minimum: 1 }

    MessageStats:
      type: object
      additionalProperties: false
      required:
        - total
        - visible
        - hidden
        - deleted
        - pending_review
        - approved
        - awaiting_publication
        - pinned
        - featured
        - polls
        - comments
        - comments_hidden
        - comments_deleted
        - likes
        - dislikes
        - last_24_hours
        - last_7_days
        - daily
        - top_tags
      properties:
        total: { type: integer, minimum: 0 }
        visible: { type: integer, minimum: 0 }
        hidden: { type: integer, minimum: 0 }
        deleted: { type: integer, minimum: 0 }
        pending_review: { type: integer, minimum: 0 }
        approved: { type: integer, minimum: 0 }
        awaiting_publication: { type: integer, minimum: 0 }
        pinned: { type: integer, minimum: 0 }
        featured: { type: integer, minimum: 0 }
        polls: { type: integer, minimum: 0 }
        comments: { type: integer, minimum: 0 }
        comments_hidden: { type: integer, minimum: 0 }
        comments_deleted: { type: integer, minimum: 0 }
        likes: { type: integer, minimum: 0 }
        dislikes: { type: integer, minimum: 0 }
        last_24_hours: { type: integer, minimum: 0 }
        last_7_days: { type: integer, minimum: 0 }
        daily:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/DailyMessageCount' }
        top_tags:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/TopTag' }

    DashboardCommunityStats:
      type: object
      additionalProperties: false
      required:
        - posting_enabled
        - commenting_enabled
        - guest_posting_enabled
        - guest_commenting_enabled
        - require_post_approval
      properties:
        posting_enabled: { type: boolean }
        commenting_enabled: { type: boolean }
        guest_posting_enabled: { type: boolean }
        guest_commenting_enabled: { type: boolean }
        require_post_approval: { type: boolean }

    DashboardReportStats:
      type: object
      additionalProperties: false
      required:
        - total
        - affected_messages
        - comment_reports
        - processed_total
        - processed_last_7_days
      properties:
        total: { type: integer, minimum: 0 }
        affected_messages: { type: integer, minimum: 0 }
        comment_reports: { type: integer, minimum: 0 }
        processed_total: { type: integer, minimum: 0 }
        processed_last_7_days: { type: integer, minimum: 0 }

    DashboardStats:
      type: object
      additionalProperties: false
      required:
        - messages
        - users
        - apps
        - feedback
        - community
        - reports
        - managers
        - trash
        - audit
        - admin_logs
      properties:
        messages: { $ref: '#/components/schemas/MessageStats' }
        users: { $ref: '#/components/schemas/UserStats' }
        apps: { $ref: '#/components/schemas/AppStats' }
        feedback: { $ref: '#/components/schemas/FeedbackStats' }
        community: { $ref: '#/components/schemas/DashboardCommunityStats' }
        reports: { $ref: '#/components/schemas/DashboardReportStats' }
        managers: { $ref: '#/components/schemas/AdminManagerStats' }
        trash: { $ref: '#/components/schemas/TrashCounts' }
        audit: { $ref: '#/components/schemas/AuditStats' }
        admin_logs: { type: integer, minimum: 0 }

    DashboardResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [generated_at, stats]
          properties:
            generated_at: { $ref: '#/components/schemas/Timestamp' }
            stats: { $ref: '#/components/schemas/DashboardStats' }
