openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Campus Wall Feature-Parity API
  version: 1.0.0
  summary: Fixed contract for campuswall-react source parity
  description: |
    Normative target contract derived only from
    Gavin-LHX/campuswall-react commit
    d33237e55e3b2a6a2ae3706f9d05aca39beab11f.

    The paths intentionally retain the reference application's URLs so a
    compatibility router can serve the existing client. Successful domain
    responses consistently contain `success: true`; only the optional user and
    administrator session probes preserve the reference client's HTTP 200
    `success: false` unauthenticated result. JSON failures use `ErrorResponse`.
    Paginated responses consistently expose `page`, `page_size`, `total`, and
    `total_pages`.

    Cookie sessions are signed and httpOnly. Every non-idempotent browser
    request must additionally pass trusted Origin/Referer validation. All
    timestamps emitted by the target implementation are RFC 3339 UTC even
    though legacy data may contain `YYYY-MM-DD HH:mm:ss`.
  license:
    name: Contract-only specification
externalDocs:
  description: Exact reference tree
  url: https://github.com/Gavin-LHX/campuswall-react/tree/d33237e55e3b2a6a2ae3706f9d05aca39beab11f
servers:
  - url: http://localhost:5412
    description: Target Node.js/Express development server; Vite may proxy API and static paths here.
tags:
  - name: System
  - name: Public
  - name: Wall
  - name: Upload
  - name: Support
  - name: User auth
  - name: User account
  - name: Favorites
  - name: Notifications
  - name: Admin auth
  - name: Admin dashboard
  - name: Admin content
  - name: Admin users
  - name: Admin managers
  - name: Admin apps
  - name: Admin notices
  - name: Admin support
  - name: Admin settings
  - name: Admin audit

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Process liveness
      x-reference-source: backend/src/server.js
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/get_messages:
    get:
      tags: [Public]
      operationId: listPublicMessages
      summary: Search, filter, sort, and window public messages
      x-reference-source: backend/src/routes/public.js
      parameters:
        - name: start
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: end
          in: query
          description: Exclusive window end; capped by server policy.
          schema: { type: integer, minimum: 1 }
        - name: s
          in: query
          description: Reference-compatible sort key.
          schema:
            type: string
            enum: [newest, likes, dislikes]
            default: newest
        - name: w
          in: query
          description: Case-sensitive legacy substring search over text and poll question.
          schema: { type: string, maxLength: 200 }
        - name: f
          in: query
          schema:
            type: string
            enum: [all, files, polls]
            default: all
      responses:
        '200':
          description: Public message window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMessageWindowResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/get_page_size:
    get:
      tags: [Public]
      operationId: getLegacyMessagePageSize
      summary: Return the reference-compatible message window size
      deprecated: true
      x-reference-source: backend/src/routes/public.js
      responses:
        '200':
          description: Configured public message page size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSizeResponse'

  /api/get_hot_messages:
    post:
      tags: [Public]
      operationId: listHotMessages
      summary: Return up to twenty hot public messages
      x-reference-source: backend/src/routes/public.js
      responses:
        '200':
          description: Ranked public messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageCollectionResponse'
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/get_message_details/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Public]
      operationId: getPublicMessage
      summary: Get one visible message with visible comments and viewer state
      x-reference-source: backend/src/routes/public.js
      responses:
        '200':
          description: Public message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/get_message_partitions/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Public]
      operationId: getMessageTags
      summary: Get tags for one visible message
      x-reference-source: backend/src/routes/public.js
      responses:
        '200':
          description: Message tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTagsResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/get_tags:
    post:
      tags: [Public]
      operationId: listPublicTags
      summary: List tags having at least one visible message
      x-reference-source: backend/src/routes/public.js
      responses:
        '200':
          description: Public tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'

  /api/get_partition_messages:
    post:
      tags: [Public]
      operationId: getTagMessageIds
      summary: List visible message IDs associated with a tag
      x-reference-source: backend/src/routes/public.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [partition]
              properties:
                partition: { $ref: '#/components/schemas/Tag' }
      responses:
        '200':
          description: Matching message IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageIdsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/notice:
    post:
      tags: [Public]
      operationId: listPublicNotices
      summary: List active public notices
      x-reference-source: backend/src/routes/public.js
      responses:
        '200':
          description: Notices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeCollectionResponse'

  /static/notice.json:
    get:
      tags: [Public]
      operationId: getLegacyNoticeDocument
      summary: Read the legacy static notice document
      deprecated: true
      x-reference-source: backend/src/server.js
      responses:
        '200':
          description: Legacy notice array without an envelope
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notice' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/apps:
    post:
      tags: [Public]
      operationId: listPublicApps
      summary: List published catalog apps
      x-reference-source: backend/src/routes/public.js
      responses:
        '200':
          description: Published apps sorted by sort order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCollectionResponse'

  /api/community/config:
    get:
      tags: [Public]
      operationId: getPublicCommunitySettings
      summary: Get public community policy without sensitive words
      x-reference-source: backend/src/routes/public.js
      responses:
        '200':
          description: Public community policy
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCommunitySettingsResponse'

  /api/help/form:
    post:
      tags: [Support]
      operationId: createFeedbackTicket
      summary: Submit a public feedback ticket
      x-reference-source: backend/src/routes/public.js
      x-trusted-origin-required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      responses:
        '201':
          description: Feedback accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackCreatedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/help/status/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Support]
      operationId: getPublicFeedbackStatus
      summary: Resolve a feedback tracking code
      x-reference-source: backend/src/routes/public.js
      responses:
        '200':
          description: Public ticket state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFeedbackResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/help/report/status/{reportId}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Support]
      operationId: getPublicReportStatus
      summary: Resolve a report tracking code
      x-reference-source: backend/src/routes/public.js
      responses:
        '200':
          description: Public report state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReportResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/help/report/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Support]
      operationId: reportMessage
      summary: Report a visible message
      x-reference-source: backend/src/routes/public.js
      x-trusted-origin-required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreatedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/help/report/{messageId}/comment/{commentId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
      - $ref: '#/components/parameters/CommentId'
    post:
      tags: [Support]
      operationId: reportComment
      summary: Report a visible comment on a visible message
      x-reference-source: backend/src/routes/public.js
      x-trusted-origin-required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreatedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/wall/submit:
    post:
      tags: [Wall]
      operationId: createMessage
      summary: Publish a message or poll
      description: Guests are forced anonymous. A logged-in user may opt into nickname display.
      x-reference-source: backend/src/routes/wall.js
      x-trusted-origin-required: true
      security:
        - {}
        - userSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: Message stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageCreatedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/wall/comment/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Wall]
      operationId: createComment
      summary: Add an anonymous comment or reply with optional attachments
      x-reference-source: backend/src/routes/wall.js
      x-trusted-origin-required: true
      security:
        - {}
        - userSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentCreate'
      responses:
        '201':
          description: Comment stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/wall/like/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Wall]
      operationId: toggleLike
      summary: Toggle like, replacing any dislike
      x-reference-source: backend/src/routes/wall.js
      x-trusted-origin-required: true
      security:
        - {}
        - userSession: []
      responses:
        '200':
          description: Current reaction and counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionResponse'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/wall/dislike/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Wall]
      operationId: toggleDislike
      summary: Toggle dislike, replacing any like
      x-reference-source: backend/src/routes/wall.js
      x-trusted-origin-required: true
      security:
        - {}
        - userSession: []
      responses:
        '200':
          description: Current reaction and counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionResponse'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/wall/poll/{messageId}/vote:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Wall]
      operationId: votePoll
      summary: Cast one immutable poll vote per viewer identity
      x-reference-source: backend/src/routes/wall.js
      x-trusted-origin-required: true
      security:
        - {}
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [option_id]
              properties:
                option_id:
                  type: string
                  pattern: '^[A-Za-z0-9-]{1,80}$'
      responses:
        '200':
          description: Vote accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollVoteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already voted or poll closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollVoteErrorResponse'
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/direct_upload:
    post:
      tags: [Upload]
      operationId: directUpload
      summary: Upload and process one file no larger than the chunk limit
      x-reference-source: backend/src/routes/upload.js
      x-trusted-origin-required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
                originalName: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Processed file name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/chunked_upload:
    post:
      tags: [Upload]
      operationId: uploadChunk
      summary: Store one validated chunk
      x-reference-source: backend/src/routes/upload.js
      x-trusted-origin-required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [chunk, chunkIndex, totalChunks, fileKey, originalName]
              properties:
                chunk: { type: string, format: binary }
                chunkIndex: { type: integer, minimum: 0 }
                totalChunks: { type: integer, minimum: 1, maximum: 50 }
                fileKey:
                  type: string
                  minLength: 1
                  maxLength: 255
                originalName:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '200':
          description: Chunk progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkUploadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/merge_chunks:
    post:
      tags: [Upload]
      operationId: mergeChunks
      summary: Atomically merge all chunks and process the completed file
      x-reference-source: backend/src/routes/upload.js
      x-trusted-origin-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileKey]
              properties:
                fileKey:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '201':
          description: Processed file name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /static/uploads/{filename}:
    parameters:
      - $ref: '#/components/parameters/Filename'
    get:
      tags: [Upload]
      operationId: getUploadedFile
      summary: Serve an original attachment
      x-reference-source: backend/src/server.js
      responses:
        '200':
          description: Stored attachment
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /static/tiny_files/{filename}:
    parameters:
      - $ref: '#/components/parameters/Filename'
    get:
      tags: [Upload]
      operationId: getAttachmentPreview
      summary: Serve a generated preview, falling back to the original
      x-reference-source: backend/src/routes/public.js
      responses:
        '200':
          description: Preview or original bytes
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/static/files/{filename}:
    parameters:
      - $ref: '#/components/parameters/Filename'
    get:
      tags: [Upload]
      operationId: getUploadedFileCompatibilityAlias
      summary: Serve an original attachment through the legacy API prefix
      deprecated: true
      x-reference-source: backend/src/routes/public.js
      x-compatibility-path-for: /static/uploads/{filename}
      responses:
        '200':
          description: Stored attachment
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/static/tiny_files/{filename}:
    parameters:
      - $ref: '#/components/parameters/Filename'
    get:
      tags: [Upload]
      operationId: getAttachmentPreviewCompatibilityAlias
      summary: Serve a preview through the legacy API prefix
      deprecated: true
      x-reference-source: backend/src/routes/public.js
      x-compatibility-path-for: /static/tiny_files/{filename}
      responses:
        '200':
          description: Preview or original bytes
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /static/apps/icons/{filename}:
    parameters:
      - $ref: '#/components/parameters/Filename'
    get:
      tags: [Upload]
      operationId: getCatalogAppIcon
      summary: Serve a locally managed catalog application icon
      x-reference-source: backend/src/server.js
      responses:
        '200':
          description: Application icon bytes
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/user/captcha/config:
    get:
      tags: [User auth]
      operationId: getCaptchaConfig
      summary: Get public student-login CAPTCHA configuration
      x-reference-source: backend/src/routes/users.js
      responses:
        '200':
          description: Public CAPTCHA settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaPublicResponse'

  /api/user/login:
    post:
      tags: [User auth]
      operationId: loginUser
      summary: Authenticate a student account
      x-reference-source: backend/src/routes/users.js
      x-trusted-origin-required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Signed session established
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/user/logout:
    post:
      tags: [User auth]
      operationId: logoutUser
      summary: Clear the student session
      x-reference-source: backend/src/routes/users.js
      x-trusted-origin-required: true
      security:
        - userSession: []
        - {}
      responses:
        '200':
          description: Session cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /api/user/me:
    get:
      tags: [User account]
      operationId: getCurrentUser
      summary: Get the authenticated user
      x-reference-source: backend/src/routes/users.js
      security:
        - userSession: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/user/session:
    get:
      tags: [User auth]
      operationId: probeUserSession
      summary: Probe an optional student session
      x-reference-source: backend/src/routes/users.js
      security:
        - userSession: []
        - {}
      responses:
        '200':
          description: Session state; an anonymous probe is a successful HTTP response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UserResponse'
                  - $ref: '#/components/schemas/AnonymousSessionResponse'

  /api/user/me/profile:
    put:
      tags: [User account]
      operationId: updateCurrentUserProfile
      summary: Update nickname, gender, and biography
      x-reference-source: backend/src/routes/users.js
      x-trusted-origin-required: true
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UserProfileUpdate' }
          application/x-www-form-urlencoded:
