components:
  securitySchemes:
    userSession:
      type: apiKey
      in: cookie
      name: user_session
      description: Signed, expiring, httpOnly student session with session version.
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
      description: Signed, expiring, httpOnly administrator session with session version.

  parameters:
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,80}$'
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, minimum: 0 }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    AdminUsername:
      name: username
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{3,40}$'
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NoticeId:
      name: noticeId
      in: path
      required: true
      description: UUID-like notice ID or a legacy zero-based index.
      schema:
        type: string
        minLength: 1
        maxLength: 80
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TrackingCodeInput' }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TrackingCodeInput' }
    Filename:
      name: filename
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[^/\\]+$'
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    UserPageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    AdminPageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, invalid, disabled, or expired session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated principal lacks permission or request origin is untrusted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found or intentionally hidden from this principal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource state changed or operation conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: Request or file exceeds the configured limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }

    SuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'

    OperationResult:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            message: { type: string }
            code: { type: string }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: string
          minLength: 1
        code:
          type: string
          maxLength: 80
        details:
          description: Structured validation or conflict detail.
          oneOf:
            - { type: object }
            - { type: array }
            - { type: string }
            - { type: 'null' }
        request_id:
          type: [string, 'null']

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }

    AnonymousSessionResponse:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error: { type: string, const: 未登录 }

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }

    PageSizeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [page_size]
          properties:
            page_size: { type: integer, minimum: 1 }

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp, emitted in UTC.

    TrackingCode:
      type: string
      pattern: '^[a-f0-9]{32}$'
      example: 0123456789abcdef0123456789abcdef

    TrackingCodeInput:
      type: string
      description: A 32-hex tracking code; hyphens are accepted and normalized away.
      pattern: '^[A-Fa-f0-9-]{32,39}$'

    Password:
      type: string
      minLength: 8
      maxLength: 128
      writeOnly: true

    Tag:
      type: string
      minLength: 1
      maxLength: 50

    StoredFilename:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^/\\]+$'

    MessageModerationStatus:
      type: string
      enum: [pending, visible, hidden, deleted]

    CommentModerationStatus:
      type: string
      enum: [visible, hidden, deleted]

    ReviewStatus:
      type: string
      enum: [pending, approved]

    PollOption:
      type: object
      additionalProperties: false
      required: [id, text, votes]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9-]{1,80}$'
        text:
          type: string
          minLength: 1
          maxLength: 80
        votes:
          type: integer
          minimum: 0

    Poll:
      type: object
      additionalProperties: false
      required: [question, options, total_votes, closes_at, selected_option_id, has_voted, is_closed]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 200
        options:
          type: array
          minItems: 2
          maxItems: 6
          items: { $ref: '#/components/schemas/PollOption' }
        total_votes:
          type: integer
          minimum: 0
        closes_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - { type: 'null' }
        selected_option_id:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9-]{1,80}$'
        has_voted: { type: boolean }
        is_closed: { type: boolean }

    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - real_name
        - nickname
        - gender
        - bio
        - avatar_url
        - status
        - muted_until
        - mute_reason
        - is_muted
        - created_at
        - updated_at
        - last_login_at
      properties:
        id: { type: integer, minimum: 1 }
        username:
          type: string
          minLength: 1
          maxLength: 100
          description: Student number; never present in public profile responses.
        real_name:
          type: string
          maxLength: 80
          description: Never present in public profile responses.
        nickname:
          type: string
          minLength: 1
          maxLength: 40
        gender:
          type: integer
          enum: [0, 1, 2]
        bio:
          type: string
          maxLength: 200
        avatar_url:
          type: string
          format: uri-reference
        status:
          type: string
          enum: [active, disabled]
        muted_until:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - { type: 'null' }
        mute_reason:
          type: string
          maxLength: 200
        is_muted: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        last_login_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - { type: 'null' }

    PublicUser:
      type: object
      additionalProperties: false
      required: [id, nickname, gender, bio, avatar_url, status, created_at]
      properties:
        id: { type: integer, minimum: 1 }
        nickname: { type: string, minLength: 1, maxLength: 40 }
        gender: { type: integer, enum: [0, 1, 2] }
        bio: { type: string, maxLength: 200 }
        avatar_url: { type: string, format: uri-reference }
        status: { type: string, enum: [active, disabled] }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    Comment:
      type: object
      additionalProperties: true
      required:
        - id
        - text
        - timestamp
        - likes
        - dislikes
        - files
        - moderation_status
        - anonymous
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,80}$'
        text:
          type: string
          maxLength: 10000
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        likes: { type: integer, minimum: 0 }
        dislikes: { type: integer, minimum: 0 }
        files:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/StoredFilename' }
        moderation_status: { $ref: '#/components/schemas/CommentModerationStatus' }
        anonymous:
          type: boolean
          const: true
        refer_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,80}$'
        refer:
          type: string
          maxLength: 120
        refer_hidden: { type: boolean }
        user_id:
          type: integer
          minimum: 1
          description: Admin/owner context only; forbidden in anonymous public output.
        username:
          type: string
          description: Admin context only.
        user:
          oneOf:
            - $ref: '#/components/schemas/User'
