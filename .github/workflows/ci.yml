name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: campus_wall
      PGUSER: campus_wall
      PGPASSWORD: campus_wall_ci
      SECRET_KEY: ci-only-secret-not-for-production
      HOST: 127.0.0.1
      PORT: 5412
      ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start native PostgreSQL
        shell: bash
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=on \
            --command "CREATE ROLE campus_wall LOGIN PASSWORD 'campus_wall_ci'"
          sudo -u postgres createdb --owner=campus_wall campus_wall
          PGPASSWORD="$PGPASSWORD" psql \
            --host=127.0.0.1 --port=5432 --username=campus_wall --dbname=campus_wall \
            --set=ON_ERROR_STOP=on --command 'SELECT 1'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Check backend syntax
        run: find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Smoke test backend
        shell: bash
        run: |
          npm run start:backend > /tmp/campus-wall-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5412/health | grep -q '"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/campus-wall-backend.log
          exit 1
