map $http_x_forwarded_proto $campus_wall_forwarded_proto {
    default $scheme;
    ~*^https$ https;
}

upstream campus_wall_backend {
    server backend:5412;
    keepalive 32;
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 500m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        proxy_pass http://campus_wall_backend;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/ {
        proxy_pass http://campus_wall_backend;
        include /etc/nginx/proxy_params;
    }

    # The Vite bundle contains a few versioned files under /static. Serve
    # those locally, then send runtime media and notices to Express.
    location ^~ /static/ {
        try_files $uri @backend_static;
    }

    location @backend_static {
        proxy_pass http://campus_wall_backend;
        include /etc/nginx/proxy_params;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
