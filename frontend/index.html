<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>校园墙</title>
    <meta name="description" content="校园墙 - 记录校园日常，分享心声与灵感。" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme-preference')
          const saved = ['system', 'light', 'dark'].includes(stored) ? stored : 'system'
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const resolved = saved === 'system' ? (systemDark ? 'dark' : 'light') : saved
          document.documentElement.dataset.theme = resolved
          document.querySelector('meta[name="theme-color"]').content = resolved === 'dark' ? '#000000' : '#f5f5f7'
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
