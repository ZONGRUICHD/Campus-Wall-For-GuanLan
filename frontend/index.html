<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/school-badge.webp" />
    <link rel="apple-touch-icon" href="/school-badge.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>龙华区观澜中学 · 校园墙</title>
    <meta name="description" content="龙华区观澜中学校园墙，记录校园日常，分享心声与互助线索。" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme-preference')
          const saved = ['system', 'light', 'dark'].includes(stored) ? stored : 'system'
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const resolved = saved === 'system' ? (systemDark ? 'dark' : 'light') : saved
          const storedPalette = localStorage.getItem('theme-palette')
          const palette = ['blue', 'rose', 'violet', 'green', 'orange'].includes(storedPalette) ? storedPalette : 'blue'
          document.documentElement.dataset.theme = resolved
          document.documentElement.dataset.palette = palette
          document.querySelector('meta[name="theme-color"]').content = resolved === 'dark' ? '#121214' : '#f5f5f7'
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.palette = 'blue'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
