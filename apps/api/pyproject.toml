[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "guanlan-campus-wall-api"
version = "0.1.0"
description = "FastAPI backend for the GuanLan campus wall"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.121,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "SQLAlchemy>=2.0.44,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
campus-wall-api = "campus_wall_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/campus_wall_api"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["campus_wall_api"]

[tool.ruff]
line-length = 100
target-version = "py314"

