server {
    listen 80;
    server_name api-wall.zongtech.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/campuswall-certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }

    access_log /www/wwwlogs/campuswall-api-access.log;
    error_log /www/wwwlogs/campuswall-api-error.log;
}

server {
    # Port 443 is reserved by the existing Xray service on this host.
    # Cloudflare Origin Rules route api-wall.zongtech.xyz to this HTTPS port.
    listen 8443 ssl;
    http2 on;
    server_name api-wall.zongtech.xyz;

    # Cloudflare Origin CA certificate; this hostname must stay proxied.
    ssl_certificate /etc/campuswall/tls/api-wall.zongtech.xyz.pem;
    ssl_certificate_key /etc/campuswall/tls/api-wall.zongtech.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusWallSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/campuswall/cloudflare-realip.conf;

    client_max_body_size 2m;
    client_body_timeout 15s;

    location = /api/direct_upload {
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /api/chunked_upload {
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /api/user/me/avatar {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /api/admin/users/import {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ^~ /static/uploads/ {
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/tiny_files/ {
        proxy_pass http://127.0.0.1:5412;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/files/ {
        proxy_pass http://127.0.0.1:5412;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5412/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }

    access_log /www/wwwlogs/campuswall-api-access.log;
    error_log /www/wwwlogs/campuswall-api-error.log;
}
