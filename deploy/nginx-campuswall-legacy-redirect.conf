server {
    listen 80;
    server_name 160.236.110.133;

    # Keep the retired IP entry deterministic after moving the frontend to Pages.
    location ^~ /api/ {
        return 308 https://api-wall.zongtech.xyz$request_uri;
    }

    location ^~ /static/ {
        return 308 https://api-wall.zongtech.xyz$request_uri;
    }

    location = /health {
        return 308 https://api-wall.zongtech.xyz/health;
    }

    location / {
        return 308 https://wall.zongtech.xyz$request_uri;
    }

    access_log /www/wwwlogs/campuswall-legacy-redirect-access.log;
    error_log /www/wwwlogs/campuswall-legacy-redirect-error.log;
}
